# Earth Defense Force 2025 (NPEB01336).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Yes, matching Untested, online features Untested; custom
# server not required.
# Notes: World Selection shows one server, tested a 4 player lobby while only playing by myself in an online game,
# everything worked as intended.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
