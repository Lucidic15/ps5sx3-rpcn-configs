# Call of Duty: Modern Warfare 2 (BLUS30429).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: it does not connect online, and no community server exists for it yet.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on (UDP 3074 for Call of Duty's matches).
  UPNP Enabled: true
