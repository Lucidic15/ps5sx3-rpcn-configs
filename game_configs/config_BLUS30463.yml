# Rock Band 3 (BLUS30463).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Untested, lobbies Untested, matching Untested, online features
# Untested; custom server available.
# Notes: Official servers and music store have been permanently shut down. A custom server exists: GoCentral, which has
# functional RPCN invites, leaderboards, a DNS server to allow crossplay between PS3, Wii, and RPCS3 users, and has
# nearly one-to-one functionality with the original servers.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
