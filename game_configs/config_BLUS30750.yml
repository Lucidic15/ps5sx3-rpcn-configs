# Resident Evil: Operation Raccoon City (BLUS30750).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Yes, matching Yes, online features Untested; custom server
# not required.
# Notes: RPCN 1.2.4 - 2024/04/25 - COOP campaign works, versus public match due to lack of minimum players unable to
# start, private match call invite freeze the game
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
