# E.X. Troopers (NPJB00235).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Yes, matching Yes, online features Yes; custom server not
# required.
# Notes: RPCN 1.2.4 2024/05/19 - co-op works, but versus softlock the host upon ready up and match didnt start tho start
# button pressed. UPNP or Port forwards helps connectivity with this title. Log
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
