# Armored Core 4 (BLES00039).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Yes, matching Yes, online features Yes; custom server
# available.
# Notes: Requires custom IP/Hosts switches.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # IP/Host switches from this game's RPCS3 wiki page.
  IP swap list: "ac4.sega.com=15.204.86.103&&ps3update.fromsoftware.jp=15.204.86.103"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
