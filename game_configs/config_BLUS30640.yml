# Lucha Libre AAA: Héroes del Ring (BLUS30640).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Yes, matching Yes, online features Partial; custom server
# available.
# Notes: Requires OpenSpy patch. Quick match doesn't work but you are able to join via custom match. Player username
# shows up as Luchador.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
