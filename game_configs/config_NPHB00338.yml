# Street Fighter III: Third Strike Online Edition (NPHB00338).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Partial, matching Partial, online features Partial; custom
# server not required.
# Notes: Attempting to use quick match or find match results in a crash, but invites to lobbies function fine. Ranked
# matches, watch replay with friends online and leaderboards also work. Tournaments untested as of now. Cannot upload
# replays.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
