# WRC 3: FIA World Rally Championship (BLUS31168).
# Shipped with the title: the launcher writes these into the game's custom configuration, with the options chosen for the
# game over them; a configuration file you made yourself is never replaced.
# Online through RPCN: sign in to RPCN, on its official server, first.
# RPCS3 wiki's RPCN Compatibility List: connects Yes, lobbies Untested, matching Untested, online features Yes; custom
# server not required.
# Notes: Game version tested: WRC 3 [BLUS31168]. Netplay allows RPCN users to upload their fastest times. Only the
# record times leader board portion of multiplayer has been tested. Leader boards showing RPCN's gamertags are working.
# Empty leaderboards still need testing since there are about 60 total stages.
Net:
  Internet enabled: "Connected"
  PSN status: "RPCN"
  DNS address: "8.8.8.8"
  # Lets RPCS3 ask the router to forward the ports the game listens on.
  UPNP Enabled: true
